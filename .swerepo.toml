# Written by SWERepo (SWEREPO-SPEC §9). Commit this file. Settings may be edited; fingerprints may not.
standard = 1
swerepo = "0.1.0.dev0"
components = ["docs", "agents", "ci", "security", "github"]
mode = "solo"

[values]
project = "swerepo"
adr_dir = "docs/adr"
progress_dir = "docs/progress"
commands = "- Install: `uv sync`\n- Test: `uv run pytest`\n- Lint: `uv run ruff check .` and `uv run ruff format --check .`\n- Check the standard: `swerepo check`"
test_inline = "`uv run pytest`, `uv run ruff check .` and `uv run ruff format --check .`"
default_branch = "main"
privacy_command = "uv run --locked swerepo"
privacy_python = "3.14"
python = ["3.11", "3.12", "3.13", "3.14"]
ci_install = "uv sync --locked"
lint = "ruff"
governance_command = "uv run --locked swerepo"
ci_copilot_review = "true"
code_owner = "@vamshidhar-pandrapagada"

[agents]
hosts = ["claude", "antigravity"]

[pr]
enforce = true  # this repository has followed the PR rules from its first PR (ADR-20261121-d0f5)

