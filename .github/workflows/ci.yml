# SWERepo's own CI (ADR-20261119-dd1a). Written by hand until SWERepo can generate
# swerepo-ci.yml (Phase 4); a ruleset requires only `ci-ok`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels the run still going for its previous commit; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.9.28"  # matches the uv_build pin in pyproject.toml; upgrade both together
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.9.28"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  # macOS minutes cost about ten times more on private repositories: pushes to main only (spec §6.2).
  test-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.9.28"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest

  # Static security audit of the workflows themselves.
  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.9.28"
      - run: uvx zizmor==1.32.0 --offline .github/workflows

  # Locked SeamSpec rules run on every PR, so a commit made with --no-verify can't slip past them
  # (ADR-20261119-6b94). Inside this workflow so `ci-ok` covers it.
  seamspec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # doctor --ci compares the ledger with the base branch
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.9.28"
          python-version: "3.12"
      - run: uv sync --locked
      # doctor --ci compares the ledger with a base: the PR's base branch, or on a push every commit
      # the push brought. Its own default (HEAD~1) misses earlier commits of a multi-commit push and
      # fails on a root commit (review finding P0-F01, docs/reviews/phase-0.md).
      - name: seamspec doctor
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            uv run seamspec doctor --ci
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            uv run seamspec doctor --ci --base "$BEFORE"
          elif git rev-parse -q --verify "HEAD~1^{commit}" >/dev/null; then
            uv run seamspec doctor --ci --base HEAD~1
          else
            uv run seamspec doctor --ci --base HEAD  # root commit: nothing earlier to compare with
          fi
      - run: uv run seamspec verify --all --ci
      # The earned spec must match the approved rules (spec §6.8, ADR-20261119-6b94).
      - run: uv run seamspec spec --check docs/EARNED_SPEC.md

  # The one check a ruleset requires. Passes only if every job succeeded, or was skipped by design
  # (test-macos on pull requests). Failed or cancelled jobs fail it.
  ci-ok:
    if: always()
    needs: [lint, test, test-macos, workflow-audit, seamspec]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          TEST_MACOS: ${{ needs.test-macos.result }}
          AUDIT: ${{ needs.workflow-audit.result }}
          SEAMSPEC: ${{ needs.seamspec.result }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          for result in "$LINT" "$TEST" "$AUDIT" "$SEAMSPEC"; do
            test "$result" = "success"
          done
          if [ "$EVENT" = "push" ]; then
            test "$TEST_MACOS" = "success"
          else
            test "$TEST_MACOS" = "skipped"
          fi
