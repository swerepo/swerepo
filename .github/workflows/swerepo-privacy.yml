# Written by SWERepo (SWEREPO-SPEC §6.4, ADR-20261122-a48e). `swerepo update` keeps it current and merges
# your edits. No personal email addresses, home-folder paths or obvious secrets in tracked files; findings
# name the file and line, never what was found.
name: swerepo-privacy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.9.28"
          python-version: "3.14"
      - run: uv run --locked swerepo check --only security --ci
