# Releases SWERepo itself, on a pushed `v*` tag (ADR-20261124-4699). This repository's own workflow: it is never part
# of the `swerepo` package or of the standard, which sets up no publishing (ADR-20261124-152d).
#
# check (tag on main, version, dated changelog, locked rules) and test → build (files, SHA256SUMS, provenance) →
# publish (after the owner's approval in the `pypi` environment: the same files, checked, through trusted publishing)
# → github-release (no checkout).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # main, to check the tag is on it
          fetch-tags: true  # the locked rules read the release tags (ADR-20261124-41e9)
          persist-credentials: false
      - name: the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: the tag matches the version, and the changelog dates it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              sys.exit(f"the tag {tag} doesn't match the version in pyproject.toml ({version})")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          head = re.search(rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}[ \t]*$", text, re.M)
          if head is None:
              sys.exit(f"CHANGELOG.md has no dated entry for {version} (## [{version}] - YYYY-MM-DD)")
          rest = text[head.end():]
          following = re.search(r"^## \[", rest, re.M)
          notes = (rest[: following.start()] if following else rest).strip()
          if not notes:
              sys.exit(f"CHANGELOG.md's entry for {version} is empty")
          open("release-notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.9.28"
          python-version: "3.14"
          enable-cache: false  # no cache in a workflow that publishes (zizmor: cache-poisoning)
      - run: uv sync --locked
      - name: the locked rules pass at the tag
        run: uv run --locked seamspec verify --all --ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.9.28"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run pytest

  build:
    needs: [check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # signing the provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.9.28"
          python-version: "3.14"
          enable-cache: false
      - run: uv build
      - name: the wheel and the sdist, and their checksums
        run: |
          mkdir release
          cp dist/*.whl dist/*.tar.gz release/
          cd release
          test "$(ls | wc -l)" -eq 2  # one wheel, one sdist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            release/*.whl
            release/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: release/
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi  # waits for the owner's approval; deployments from v* tags only
      url: https://pypi.org/p/swerepo
    permissions:
      id-token: write  # trusted publishing, nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: staging
      - name: the files are the ones built and attested
        run: |
          cd staging
          sha256sum -c SHA256SUMS
          mkdir ../dist
          mv -- *.whl *.tar.gz ../dist/  # SHA256SUMS stays here: the action checks every file in dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # creating the release, nothing else; no checkout shares this token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: staging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd staging && sha256sum -c SHA256SUMS)
          gh release create "$TAG" staging/*.whl staging/*.tar.gz staging/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes/release-notes.md
