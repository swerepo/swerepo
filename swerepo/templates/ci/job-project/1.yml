  # The project in @@folder@@ (spec §11).
  lint-@@job@@:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: @@folder@@
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.9.28"
          python-version: "@@python_main@@"
      - run: @@install@@
@@lint_runs@@

  test-@@job@@:
    strategy:
      fail-fast: false
      matrix:
        python: @@python_matrix@@
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: @@folder@@
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.9.28"
          python-version: ${{ matrix.python }}
      - run: @@install@@
      - run: uv run pytest
