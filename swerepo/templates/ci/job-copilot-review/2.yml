  # Merges wait for Copilot's review of the pull request, of any commit (ADR-20261123-a359): asked every 30
  # seconds for up to 20 minutes; a later push passes at once. Re-run the job if the review came later.
  # Dependabot's own pull requests don't wait: GitHub never requests Copilot for them (ADR-20261123-cc8d).
  # Nor does any pull request while no ruleset on the default branch requests Copilot (ADR-20261126-c228).
  copilot-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pull-requests: read
    steps:
      - name: wait for Copilot's review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail  # a failing gh call stops the job with its own error, not a 20-minute wait
          if [ "${DRAFT:-false}" = "true" ]; then
            # the ruleset doesn't request Copilot's review on drafts: don't wait for one that won't come
            echo "A draft: Copilot reviews it once it is marked ready for review, and this job runs again then."
            exit 1
          fi
          case "${AUTHOR:-}" in
            "dependabot[bot]")
              # Dependabot: GitHub requests Copilot's review only for authors who have Copilot, so none comes. Its
              # pull request holds Dependabot's commits only: its branch is in this repository, and every commit is
              # authored by Dependabot and committed and signed by GitHub itself (`web-flow`), which no one else can
              # be. Anything else fails at once: changes by people or agents go in a pull request of their own, which
              # waits for Copilot (ADR-20261123-cc8d).
              commits=""
              if [ "${HEAD_REPO:-}" = "$REPOSITORY" ]; then
                commits=$(gh api "repos/$REPOSITORY/pulls/$NUMBER/commits" --paginate \
                  --jq '.[] | "\(.author.login // "-") \(.commit.verification.verified) \(.committer.login // "-")"')
              fi
              others=$(printf '%s\n' "$commits" \
                | awk 'NF && ($1 != "dependabot[bot]" || $2 != "true" || $3 != "web-flow")' | wc -l)
              # GitHub lists at most 250 commits of a pull request: a list that long may hide others, so it fails
              listed=$(printf '%s\n' "$commits" | awk 'NF' | wc -l)
              if [ -n "$commits" ] && [ "$listed" -lt 250 ] && [ "$others" -eq 0 ]; then
                echo "Opened by Dependabot, every commit its own: dependency updates don't wait for Copilot's review."
                exit 0
              fi
              echo "Opened by Dependabot, but not only its own commits on a branch of this repository: a dependency"
              echo "update's pull request holds only Dependabot's commits. Open a separate one for other changes."
              exit 1
              ;;
          esac
          # GitHub requests Copilot's review only through an active `copilot_code_review` rule. Read the default
          # branch's rules once, whatever the pull request's base, so retargeting can't skip the wait: no such rule
          # (the ruleset isn't applied yet), nothing to wait for (ADR-20261126-c228).
          if [ -z "${DEFAULT_BRANCH:-}" ]; then
            echo "GitHub gave no default branch: can't tell whether a ruleset requests Copilot's review."
            exit 1
          fi
          branch=$(jq -rn --arg b "$DEFAULT_BRANCH" '$b | @uri')  # one path segment: release/1.0, fix#1
          err=$(mktemp)
          trap 'rm -f "$err"' EXIT  # every way out removes it, keeping the step's exit status
          status=0
          rules=$(gh api "repos/$REPOSITORY/rules/branches/$branch" --paginate \
            --jq '.[] | select(.type == "copilot_code_review") | .ruleset_id' 2>"$err") || status=$?
          if [ "$status" -ne 0 ]; then
            # A private repository on GitHub Free has no rulesets, so nothing requests Copilot. gh's stderr must be
            # exactly the one line GitHub gave there (ADR-20261126-c228): any other text fails, never skipping a wait.
            free="gh: Upgrade to GitHub Pro or make this repository public to enable this feature. (HTTP 403)"
            if [ "${PRIVATE:-}" = "true" ] && [ "$(cat "$err")" = "$free" ]; then
              echo "Rulesets aren't available on this private repository's plan: nothing requests Copilot's review."
              exit 0
            fi
            cat "$err" >&2
            exit "$status"
          fi
          if [ -z "$rules" ]; then
            echo "Nothing requests Copilot's review on $DEFAULT_BRANCH yet: the ruleset isn't applied. This job waits"
            echo "once it is (swerepo init --only github --apply-github). To have Copilot review this pull request"
            echo "anyway: gh pr edit $NUMBER --add-reviewer @copilot"
            exit 0
          fi
          for attempt in $(seq 1 40); do
            # one line per review by Copilot, on any page of the list
            reviewed=$(gh api "repos/$REPOSITORY/pulls/$NUMBER/reviews" --paginate \
              --jq '.[] | select(.user.login == "copilot-pull-request-reviewer[bot]") | .id' | wc -l)
            if [ "$reviewed" -gt 0 ]; then
              echo "Copilot has reviewed this pull request."
              exit 0
            fi
            echo "Waiting for Copilot's review ($attempt of 40)."
            sleep 30
          done
          echo "No review from Copilot after 20 minutes: request it (gh pr edit $NUMBER --add-reviewer @copilot, or the"
          echo "Reviewers box), then re-run this job."
          exit 1
